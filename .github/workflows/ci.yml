name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Ensure third_party A2UI dependencies
        run: bash scripts/ensure_a2ui.sh

      - name: Install NPM dependencies
        run: npm install

      - name: Style boundary check
        run: npm run lint:styles

      - name: Run Full Test Suite (Frontend + Backend)
        run: npm test
        env:
          OPENROUTER_API_KEY: "dummy-key-for-unit-tests"

      - name: Build Frontend & Embed Packages
        run: npm run build
