<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2Learn iframe Embed Example</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "PingFang SC", "Microsoft YaHei";
        background: #f6f7f9;
      }
      .card {
        max-width: 1100px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 12px;
        padding: 16px;
      }
      iframe {
        width: 100%;
        border: 0;
        display: block;
        min-height: 520px;
      }
      code {
        background: rgba(0, 0, 0, 0.04);
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 style="margin: 0 0 8px">iframe 集成示例</h1>
      <p style="margin: 0 0 12px; color: rgba(0, 0, 0, 0.7)">
        修改 <code>viewerUrl</code> 与 <code>messagesUrl</code> 后刷新页面。
      </p>
      <iframe id="preview"></iframe>
    </div>

    <script>
      const viewerUrl = "http://127.0.0.1:8010/";
      const messagesUrl = "http://127.0.0.1:8010/generated/site_messages.json";

      const themeVars = {
        "--a2ui-color-primary": "#10b981",
        "--a2ui-card-border-radius": "20px",
      };

      const src =
        viewerUrl +
        "?embed=1&mode=offline&messagesUrl=" +
        encodeURIComponent(messagesUrl) +
        "&themeVars=" +
        encodeURIComponent(JSON.stringify(themeVars));

      document.getElementById("preview").src = src;
    </script>
  </body>
</html>
