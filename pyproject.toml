[project]
name = "a2learn"
version = "0.1.0"
description = "Agent-native learning UI generation and editing backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "langchain>=1.3,<2",
    "langchain-openai>=1,<2",
    "langgraph>=1.1.5,<2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "matplotlib>=3.11.1",
    "pypdf>=5.0,<7",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1.0.1,<2",
    "requests>=2.34.2",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
# The repository is an application, not a wheel published to PyPI. Keeping it
# virtual prevents uv from requiring a build backend while still managing the
# project's .venv and lockfile.
package = false
