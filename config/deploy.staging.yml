# Kamal staging deploy config for the A2Learn BYOK backend (apps/api).
# Same image/registry as production, different (cheaper/riskier-to-break) box.
# Run with: kamal deploy -d staging

service: a2learn-api

image: zc6600/a2learn-api

servers:
  web:
    - &main_server 39.105.9.33

registry:
  server: crpi-srr1i7ks3j0knvyv.cn-hangzhou.personal.cr.aliyuncs.com
  username: zc6600
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root

proxy:
  ssl: false                             # Cloudflare handles HTTPS at the edge
  host: api-staging.yourdomain.com       # TODO: replace with your real staging domain
  app_port: 8008
  healthcheck:
    path: /healthz
    interval: 3
    threshold: 5

env:
  clear:
    A2LEARN_ALLOWED_ORIGINS: "*"         # staging: fine to leave open for testing

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "bash"

builder:
  arch: amd64
