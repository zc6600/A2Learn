# Kamal production deploy config for the A2Learn BYOK backend (apps/api).
#
# Target: Aliyun ECS production server, image pushed to Aliyun ACR.
# TLS is terminated by Cloudflare (Tunnel or proxied DNS) in front of this
# box, so kamal-proxy runs with ssl: false and only speaks plain HTTP.
#
# This backend is stateless (BYOK: every request carries the visitor's own
# OpenRouter key, nothing persisted server-side) — no database, no volumes,
# no Rails-style secrets needed. Only the registry password is required.

service: a2learn-api

image: zc6600/a2learn-api

servers:
  web:
    - &main_server 39.105.9.33

registry:
  server: crpi-srr1i7ks3j0knvyv.cn-hangzhou.personal.cr.aliyuncs.com
  username: zc6600
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root

proxy:
  ssl: false                             # Cloudflare handles HTTPS at the edge
  host: api.a2learn.zc6600.wiki
  app_port: 8008
  # /api/session/start itself now returns immediately (generation runs in a
  # background thread, polled via /status), but /api/session/{id}/action
  # still runs a single synchronous LLM call per request and can occasionally
  # run long — kamal-proxy's 30s default response_timeout was causing a 504
  # there too.
  response_timeout: 1200
  healthcheck:
    path: /healthz
    interval: 3
    timeout: 5

env:
  clear:
    A2LEARN_ALLOWED_ORIGINS: https://a2learn.zc6600.wiki
    # google/gemini-3.5-flash-lite was tried here but OpenRouter returns a
    # 403 "not available in your region" from this server's location
    # (Aliyun Hangzhou). deepseek/deepseek-v4-flash worked but hit
    # intermittent JSON-formatting failures even after the agent/llm.py
    # fixes (greedy fence matching, prompt guardrail, retry-on-parse-failure,
    # max_tokens). Trying qwen/qwen3.7-flash next — faster locally (~100s vs
    # 180-400s for the full 3-step pipeline) and, being an Alibaba model,
    # should be reachable from this Aliyun box.
    OPENROUTER_MODEL: qwen/qwen3.7-flash

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "bash"

builder:
  arch: amd64
