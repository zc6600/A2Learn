# Kamal destination config for Azure Server (azureserver / 20.6.131.6)
# Used with: kamal deploy -d azure

servers:
  web:
    - 20.6.131.6

ssh:
  user: zhuchen
  keys:
    - ~/.ssh/B2fvm_key.pem

builder:
  arch: amd64
  # Docker buildx opens its own SSH connection; use the configured alias so
  # it picks up the Azure private key rather than falling back to defaults.
  remote: ssh://azureserver
  # The Aliyun personal registry rejects BuildKit OCI attestations.
  provenance: false
  sbom: false

env:
  clear:
    A2LEARN_MCP_ALLOWED_HOSTS: api.a2learn.zc6600.wiki
    A2LEARN_VIEWER_PUBLIC_URL: https://a2learn.zc6600.wiki
    A2LEARN_PAGE_DOCUMENT_DB_PATH: /data/a2learn.sqlite3
    A2LEARN_SESSION_DB_PATH: /data/a2learn.sqlite3
    A2LEARN_KNOWLEDGE_DB_PATH: /data/knowledge.sqlite3
    A2LEARN_KNOWLEDGE_STORAGE_ROOT: /data/knowledge-files
    A2LEARN_EXAMPLE_AUDIO_DIR: /data/example-audio

volumes:
  - "/var/lib/a2learn/data:/data"
